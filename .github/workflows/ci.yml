name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Snakemake
        run: |
          python -m pip install --upgrade pip
          python -m pip install "snakemake>=9,<10"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Lint workflow
        run: snakemake --snakefile "$GITHUB_WORKSPACE/workflow/Snakefile" --lint

      - name: Dry-run workflow with minimal fixtures
        run: >
          snakemake
          --snakefile "$GITHUB_WORKSPACE/workflow/Snakefile"
          --directory "$GITHUB_WORKSPACE/tests/workdir"
          --cores 1
          --dry-run
          all

      - name: Dry-run annotation workflow
        run: >
          snakemake
          --snakefile "$GITHUB_WORKSPACE/workflow/Snakefile.annotation"
          --directory "$GITHUB_WORKSPACE/tests/workdir"
          --cores 2
          --config external_assembly=raw_data/test_assembly.fa
          --dry-run
          all

      - name: Dry-run purge_dups with mixed assemblies and no LongStitch
        run: >
          snakemake
          --snakefile "$GITHUB_WORKSPACE/workflow/Snakefile"
          --directory "$GITHUB_WORKSPACE/tests/workdir"
          --cores 4
          --config purge_dups_enabled=True longstitch_enabled=False selected_assemblies='["primary","hap1","hap2"]'
          --dry-run
          renamed_all

      - name: Dry-run all selected assemblies
        run: >
          snakemake
          --snakefile "$GITHUB_WORKSPACE/workflow/Snakefile"
          --directory "$GITHUB_WORKSPACE/tests/workdir"
          --cores 4
          --config selected_assemblies='["primary","hap1","hap2"]'
          --dry-run
          gene_prediction_all

      - name: Dry-run VARUS annotation without local RNA-seq
        run: |
          varus_workdir=$(mktemp -d)
          mkdir -p "$varus_workdir/config" "$varus_workdir/raw_data"
          cp "$GITHUB_WORKSPACE/tests/workdir/config/config.yml" "$varus_workdir/config/"
          cp "$GITHUB_WORKSPACE/tests/workdir/raw_data/test_assembly.fa" "$varus_workdir/raw_data/"
          snakemake \
            --snakefile "$GITHUB_WORKSPACE/workflow/Snakefile.annotation" \
            --directory "$varus_workdir" --cores 2 --dry-run \
            --config external_assembly=raw_data/test_assembly.fa braker4_rnaseq_source=varus \
            -- all
