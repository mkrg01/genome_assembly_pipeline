; Settings for BRAKER4 v0.5.0-beta, commit c72618baa4631db4a4128391a40c8ba7392df17c.
; run_braker4.py fills in paths and the resources allocated by the parent workflow.
[containers]
braker3_image = docker://teambraker/braker3:v3.0.10
agat_image = docker://quay.io/biocontainers/agat:1.4.1--pl5321hdfd78af_0
varus_image = docker://katharinahoff/varus-notebook:v0.0.6

[PARAMS]
fungus = 0
min_contig = 10000
; Filled by the runner from braker4_rnaseq_source (local or varus).
use_varus = 0
skip_optimize_augustus = 0
skip_single_exon_downsampling = 0
downsampling_lambda = 2
use_dev_shm = 0
; Retain the existing evidence policy: RNA-seq + OrthoDB, without BUSCO hints.
use_compleasm_hints = 0
run_best_by_compleasm = 1
; BUSCO and OMArk are evaluated by the parent workflow on the exported sequences.
skip_busco = 1
run_omark = 0
run_ncrna = 0
translation_table = 1
allow_hinted_splicesites = gcag,atac
augustus_chunksize = 3000000
augustus_overlap = 500000
; Keep the upstream DAG's files for restart and inspection after successful runs.
no_cleanup = 1

[fantasia]
enable = 0
